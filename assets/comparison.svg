<svg width="920" height="560" xmlns="http://www.w3.org/2000/svg">

  <!-- Page background -->
  <rect width="920" height="560" fill="#0d1117"/>

  <!-- ═══════════════════════════════
       LEFT PANEL — Without templates
  ════════════════════════════════ -->
  <rect x="20" y="20" width="426" height="520" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="20" y="20" width="426" height="38" rx="10" fill="#21262d"/>
  <rect x="20" y="42" width="426" height="16" fill="#21262d"/>
  <circle cx="44" cy="39" r="6" fill="#ff5f57"/>
  <circle cx="66" cy="39" r="6" fill="#febc2e"/>
  <circle cx="88" cy="39" r="6" fill="#28c840"/>
  <text x="233" y="44" text-anchor="middle" fill="#8b949e" font-size="12" font-family="sans-serif">without templates</text>

  <!-- user 1 -->
  <text x="40" y="82" fill="#6e7681" font-size="13" font-family="monospace">›</text>
  <text x="56" y="82" fill="#c9d1d9" font-size="12" font-family="monospace">help me prioritize my backlog</text>

  <!-- claude 1 -->
  <text x="40" y="106" fill="#58a6ff" font-size="11" font-family="sans-serif">Claude</text>
  <text x="40" y="123" fill="#8b949e" font-size="11" font-family="monospace">Here's how RICE scoring works.</text>
  <text x="40" y="139" fill="#8b949e" font-size="11" font-family="monospace">Reach × Impact × Confidence ÷ Effort…</text>

  <!-- user 2 -->
  <text x="40" y="163" fill="#6e7681" font-size="13" font-family="monospace">›</text>
  <text x="56" y="163" fill="#c9d1d9" font-size="12" font-family="monospace">we're enterprise, trying to cut churn</text>

  <!-- claude 2 -->
  <text x="40" y="187" fill="#58a6ff" font-size="11" font-family="sans-serif">Claude</text>
  <text x="40" y="204" fill="#8b949e" font-size="11" font-family="monospace">In that case, weight retention more</text>
  <text x="40" y="220" fill="#8b949e" font-size="11" font-family="monospace">heavily in your scoring…</text>

  <!-- user 3 -->
  <text x="40" y="244" fill="#6e7681" font-size="13" font-family="monospace">›</text>
  <text x="56" y="244" fill="#c9d1d9" font-size="12" font-family="monospace">what about our biggest customer's asks?</text>

  <!-- claude 3 -->
  <text x="40" y="268" fill="#58a6ff" font-size="11" font-family="sans-serif">Claude</text>
  <text x="40" y="285" fill="#8b949e" font-size="11" font-family="monospace">It depends on how much revenue they</text>
  <text x="40" y="301" fill="#8b949e" font-size="11" font-family="monospace">represent and your overall strategy…</text>

  <!-- user 4 -->
  <text x="40" y="325" fill="#6e7681" font-size="13" font-family="monospace">›</text>
  <text x="56" y="325" fill="#c9d1d9" font-size="12" font-family="monospace">ok but what should I actually ship?</text>

  <!-- claude 4 -->
  <text x="40" y="349" fill="#58a6ff" font-size="11" font-family="sans-serif">Claude</text>
  <text x="40" y="366" fill="#8b949e" font-size="11" font-family="monospace">Without knowing your full backlog and</text>
  <text x="40" y="382" fill="#8b949e" font-size="11" font-family="monospace">priorities, I'd suggest starting with</text>
  <text x="40" y="398" fill="#8b949e" font-size="11" font-family="monospace">the highest-impact items…</text>

  <!-- outcome bad -->
  <rect x="32" y="434" width="402" height="82" rx="6" fill="#1c0a0a" stroke="#f85149" stroke-width="1"/>
  <text x="50" y="458" fill="#f85149" font-size="12" font-family="sans-serif">✗  No decision</text>
  <text x="50" y="478" fill="#8b949e" font-size="11" font-family="sans-serif">You re-explained context 4 times.</text>
  <text x="50" y="496" fill="#8b949e" font-size="11" font-family="sans-serif">Still don't know what to ship or why.</text>

  <!-- ═══════════════════════════════
       RIGHT PANEL — With templates
  ════════════════════════════════ -->
  <rect x="474" y="20" width="426" height="520" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="474" y="20" width="426" height="38" rx="10" fill="#21262d"/>
  <rect x="474" y="42" width="426" height="16" fill="#21262d"/>
  <circle cx="498" cy="39" r="6" fill="#ff5f57"/>
  <circle cx="520" cy="39" r="6" fill="#febc2e"/>
  <circle cx="542" cy="39" r="6" fill="#28c840"/>
  <text x="687" y="44" text-anchor="middle" fill="#8b949e" font-size="12" font-family="sans-serif">with templates</text>

  <!-- context loaded banner -->
  <rect x="486" y="64" width="402" height="42" rx="5" fill="#0a1f12" stroke="#238636" stroke-width="1"/>
  <text x="504" y="81" fill="#3fb950" font-size="11" font-family="sans-serif">✓  CLAUDE.md loaded</text>
  <text x="504" y="98" fill="#8b949e" font-size="10" font-family="monospace">Q3 · 14 items · retention focus · $50K+ ACV · success = NRR +6pts</text>

  <!-- claude 1 — pushes back -->
  <text x="486" y="126" fill="#58a6ff" font-size="11" font-family="sans-serif">Claude</text>
  <text x="486" y="143" fill="#c9d1d9" font-size="11" font-family="monospace">Item #3 has no evidence beyond one</text>
  <text x="486" y="159" fill="#c9d1d9" font-size="11" font-family="monospace">customer request. What data backs it?</text>

  <!-- user 1 -->
  <text x="486" y="183" fill="#6e7681" font-size="13" font-family="monospace">›</text>
  <text x="502" y="183" fill="#c9d1d9" font-size="12" font-family="monospace">3 churn interviews + 18 support tickets</text>

  <!-- claude 2 — ranked decision -->
  <text x="486" y="207" fill="#58a6ff" font-size="11" font-family="sans-serif">Claude</text>
  <text x="486" y="224" fill="#c9d1d9" font-size="11" font-family="monospace">Validated. Ship items 1, 3, 7.</text>
  <text x="486" y="240" fill="#c9d1d9" font-size="11" font-family="monospace">Cut 5, 9, 11 — rationale for each</text>
  <text x="486" y="256" fill="#c9d1d9" font-size="11" font-family="monospace">is defensible to your VP.</text>

  <!-- user 2 -->
  <text x="486" y="280" fill="#6e7681" font-size="13" font-family="monospace">›</text>
  <text x="502" y="280" fill="#c9d1d9" font-size="12" font-family="monospace">how do I handle sales pushing back on #5?</text>

  <!-- claude 3 -->
  <text x="486" y="304" fill="#58a6ff" font-size="11" font-family="sans-serif">Claude</text>
  <text x="486" y="321" fill="#c9d1d9" font-size="11" font-family="monospace">Sales will argue revenue. Your counter:</text>
  <text x="486" y="337" fill="#c9d1d9" font-size="11" font-family="monospace">#5 serves one $80K account. Items 1+3</text>
  <text x="486" y="353" fill="#c9d1d9" font-size="11" font-family="monospace">protect $1.2M in at-risk ARR this quarter.</text>

  <!-- outcome good -->
  <rect x="486" y="434" width="402" height="82" rx="6" fill="#071d0f" stroke="#238636" stroke-width="1"/>
  <text x="504" y="458" fill="#3fb950" font-size="12" font-family="sans-serif">✓  Decision made, rationale documented</text>
  <text x="504" y="478" fill="#8b949e" font-size="11" font-family="sans-serif">You know what to ship, what to cut,</text>
  <text x="504" y="496" fill="#8b949e" font-size="11" font-family="sans-serif">and how to defend it to anyone who asks.</text>

</svg>
