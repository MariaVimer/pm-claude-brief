<svg width="920" height="560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
  </defs>

  <!-- Page background -->
  <rect width="920" height="560" fill="#0d1117"/>

  <!-- ═══════════════════════════════════════
       LEFT PANEL — Without templates
  ════════════════════════════════════════ -->
  <rect x="20" y="20" width="426" height="520" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="20" y="20" width="426" height="38" rx="10" fill="#21262d"/>
  <rect x="20" y="42" width="426" height="16" fill="#21262d"/>
  <circle cx="44" cy="39" r="6" fill="#ff5f57"/>
  <circle cx="66" cy="39" r="6" fill="#febc2e"/>
  <circle cx="88" cy="39" r="6" fill="#28c840"/>
  <text x="233" y="44" text-anchor="middle" fill="#8b949e" font-size="12" class="sans">without templates</text>

  <!-- Turn 1: user -->
  <text x="40" y="82" fill="#6e7681" font-size="12" class="mono">›</text>
  <text x="56" y="82" fill="#c9d1d9" font-size="12" class="mono">help me prioritize my backlog</text>

  <!-- Turn 1: Claude -->
  <text x="40" y="108" fill="#58a6ff" font-size="11" class="sans">Claude</text>
  <text x="40" y="126" fill="#8b949e" font-size="11" class="mono">Here's how RICE scoring works.</text>
  <text x="40" y="142" fill="#8b949e" font-size="11" class="mono">Reach × Impact × Confidence ÷ Effort…</text>

  <!-- Turn 2: user -->
  <text x="40" y="168" fill="#6e7681" font-size="12" class="mono">›</text>
  <text x="56" y="168" fill="#c9d1d9" font-size="12" class="mono">we're enterprise, trying to cut churn</text>

  <!-- Turn 2: Claude -->
  <text x="40" y="194" fill="#58a6ff" font-size="11" class="sans">Claude</text>
  <text x="40" y="212" fill="#8b949e" font-size="11" class="mono">In that case, weight retention more</text>
  <text x="40" y="228" fill="#8b949e" font-size="11" class="mono">heavily in your scoring…</text>

  <!-- Turn 3: user -->
  <text x="40" y="254" fill="#6e7681" font-size="12" class="mono">›</text>
  <text x="56" y="254" fill="#c9d1d9" font-size="12" class="mono">what about our biggest customer's asks?</text>

  <!-- Turn 3: Claude -->
  <text x="40" y="280" fill="#58a6ff" font-size="11" class="sans">Claude</text>
  <text x="40" y="298" fill="#8b949e" font-size="11" class="mono">It depends on how much revenue they</text>
  <text x="40" y="314" fill="#8b949e" font-size="11" class="mono">represent and your overall strategy…</text>

  <!-- Turn 4: user -->
  <text x="40" y="340" fill="#6e7681" font-size="12" class="mono">›</text>
  <text x="56" y="340" fill="#c9d1d9" font-size="12" class="mono">ok but what should I actually ship?</text>

  <!-- Turn 4: Claude -->
  <text x="40" y="366" fill="#58a6ff" font-size="11" class="sans">Claude</text>
  <text x="40" y="384" fill="#8b949e" font-size="11" class="mono">Without knowing your full backlog,</text>
  <text x="40" y="400" fill="#8b949e" font-size="11" class="mono">capacity, and priorities, I'd suggest</text>
  <text x="40" y="416" fill="#8b949e" font-size="11" class="mono">starting with high-impact items…</text>

  <!-- Outcome box: bad -->
  <rect x="32" y="448" width="402" height="72" rx="6" fill="#1c0a0a" stroke="#f85149" stroke-width="1"/>
  <text x="50" y="470" fill="#f85149" font-size="12" class="sans">✗  No decision</text>
  <text x="50" y="490" fill="#8b949e" font-size="11" class="sans">You re-explained context 4 times.</text>
  <text x="50" y="508" fill="#8b949e" font-size="11" class="sans">Still don't know what to ship or why.</text>


  <!-- ═══════════════════════════════════════
       RIGHT PANEL — With templates
  ════════════════════════════════════════ -->
  <rect x="474" y="20" width="426" height="520" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="474" y="20" width="426" height="38" rx="10" fill="#21262d"/>
  <rect x="474" y="42" width="426" height="16" fill="#21262d"/>
  <circle cx="498" cy="39" r="6" fill="#ff5f57"/>
  <circle cx="520" cy="39" r="6" fill="#febc2e"/>
  <circle cx="542" cy="39" r="6" fill="#28c840"/>
  <text x="687" y="44" text-anchor="middle" fill="#8b949e" font-size="12" class="sans">with templates</text>

  <!-- Context loaded banner -->
  <rect x="486" y="66" width="402" height="40" rx="5" fill="#0a1f12" stroke="#238636" stroke-width="1"/>
  <text x="502" y="82" fill="#3fb950" font-size="11" class="sans">✓  CLAUDE.md loaded</text>
  <text x="502" y="98" fill="#8b949e" font-size="10" class="mono">Q3 · 14 items · retention focus · $50K+ ACV · success = NRR +6pts</text>

  <!-- Turn 1: Claude pushes back -->
  <text x="486" y="128" fill="#58a6ff" font-size="11" class="sans">Claude</text>
  <text x="486" y="146" fill="#c9d1d9" font-size="11" class="mono">Item #3 has no evidence beyond one</text>
  <text x="486" y="162" fill="#c9d1d9" font-size="11" class="mono">customer request. What data backs it?</text>

  <!-- Turn 1: user -->
  <text x="486" y="188" fill="#6e7681" font-size="12" class="mono">›</text>
  <text x="502" y="188" fill="#c9d1d9" font-size="12" class="mono">3 churn interviews + 18 support tickets</text>

  <!-- Turn 2: Claude gives ranked list -->
  <text x="486" y="214" fill="#58a6ff" font-size="11" class="sans">Claude</text>
  <text x="486" y="232" fill="#c9d1d9" font-size="11" class="mono">Validated. Ship items 1, 3, 7.</text>
  <text x="486" y="248" fill="#c9d1d9" font-size="11" class="mono">Cut 5, 9, 11 — rationale for each</text>
  <text x="486" y="264" fill="#c9d1d9" font-size="11" class="mono">is defensible to your VP.</text>

  <!-- Turn 2: user -->
  <text x="486" y="290" fill="#6e7681" font-size="12" class="mono">›</text>
  <text x="502" y="290" fill="#c9d1d9" font-size="12" class="mono">how do I handle sales pushing back on #5?</text>

  <!-- Turn 3: Claude -->
  <text x="486" y="316" fill="#58a6ff" font-size="11" class="sans">Claude</text>
  <text x="486" y="334" fill="#c9d1d9" font-size="11" class="mono">Sales will argue revenue. Your counter:</text>
  <text x="486" y="350" fill="#c9d1d9" font-size="11" class="mono">#5 serves one $80K account. Items 1+3</text>
  <text x="486" y="366" fill="#c9d1d9" font-size="11" class="mono">protect $1.2M in at-risk ARR this quarter.</text>

  <!-- Outcome box: good -->
  <rect x="486" y="448" width="402" height="72" rx="6" fill="#071d0f" stroke="#238636" stroke-width="1"/>
  <text x="504" y="470" fill="#3fb950" font-size="12" class="sans">✓  Decision made, rationale documented</text>
  <text x="504" y="490" fill="#8b949e" font-size="11" class="sans">You know what to ship, what to cut,</text>
  <text x="504" y="508" fill="#8b949e" font-size="11" class="sans">and how to defend it to anyone who asks.</text>

</svg>
